version: 2

semantic_models:
  - name: fact_order
    description: table that contained order data - granularity on order_id
    model: ref('fact_order')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: order_id
        expr: order_id
        type: primary
      - name: customer_id
        expr: customer_id
        type: foreign
      - name: restaurant_id
        expr: restaurant_id
        type: foreign
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
      - name: city
        type: categorical
      - name: order_status
        type: categorical
      - name: payment_method
        type: categorical
    measures:
      - name: count_order_total
        expr: order_id
        agg: count
      - name: count_order_delivered
        expr: IFF(is_delivered, 1, 0)
        agg: sum
      - name: count_order_cancelled
        expr: IFF(is_cancelled, 1, 0)
        agg: sum
      - name: count_order_refunded
        expr: IFF(is_refunded, 1, 0)
        agg: sum
      - name: gmv
        expr: case when order_status == 'Delivered' then sales_amount end
        agg: sum