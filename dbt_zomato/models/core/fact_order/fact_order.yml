version: 2

models:
  - name: fact_order
    description: '{{ doc("fact_order") }}'
    columns:
      - name: order_id
        description: '{{ doc("fact_order_order_id") }}'
        data_tests:
          - unique
          - not_null
      - name: order_timestamp
        description: '{{ doc("fact_order_order_timestamp") }}'
      - name: order_date
        description: '{{ doc("fact_order_order_date") }}'
      - name: customer_id
        description: '{{ doc("fact_order_customer_id") }}'
      - name: restaurant_id
        description: '{{ doc("fact_order_restaurant_id") }}'
      - name: city
        description: '{{ doc("fact_order_city") }}'
      - name: cuisine
        description: '{{ doc("fact_order_cuisine") }}'
      - name: payment_method
        description: '{{ doc("fact_order_payment_method") }}'
      - name: order_status
        description: '{{ doc("fact_order_order_status") }}'
      - name: is_delivered
        description: '{{ doc("fact_order_is_delivered") }}'
      - name: items_count
        description: '{{ doc("fact_order_items_count") }}'
      - name: sales_qty
        description: '{{ doc("fact_order_sales_qty") }}'
      - name: subtotal
        description: '{{ doc("fact_order_subtotal") }}'
      - name: discount
        description: '{{ doc("fact_order_discount") }}'
      - name: delivery_fee
        description: '{{ doc("fact_order_delivery_fee") }}'
      - name: gst
        description: '{{ doc("fact_order_gst") }}'
      - name: sales_amount
        description: '{{ doc("fact_order_sales_amount") }}'
      - name: customer_rating
        description: '{{ doc("fact_order_customer_rating") }}'
      - name: delivery_time_min
        description: '{{ doc("fact_order_delivery_time_min") }}'
